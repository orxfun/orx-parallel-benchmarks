[package]
name = "suspicious_find_any"
version = "0.1.0"
edition = "2024"
publish = ["artifactory"]

[dependencies]
clap = { version = "4.6.6" }
orx-criterion = { version = "1.0.0" }
orx-parallel = { git = "https://github.com/orxfun/orx-parallel", branch = "feat/redesign-abstractions-api-wasm-support", default-features = false }
bench-helper = { path = "../../bench-helper" }
